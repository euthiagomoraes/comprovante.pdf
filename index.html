<script>


/*

CONFIGURAÇÃO DO SUPABASE

const SUPABASE_URL =
    "https://gotszlmzwkhyymtpnkwp.supabase.co";


/*

 *

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvdHN6bG16d2toeXltdHBua3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTQ3NjYsImV4cCI6MjEwNDUzMDc2Nn0.HjF8uEBmPw-4rcLf8ZajIit1lhekrhNIvkXbjWEtftg";


const SUPABASE_TABLE =
    "localizacoes";



/*
===========================================================
ELEMENTOS DA PÁGINA
===========================================================
*/


const locationButton =
    document.getElementById(
        "locationButton"
    );


const status =
    document.getElementById(
        "status"
    );



/*
===========================================================
REFERÊNCIA DO LINK
===========================================================
*
* Exemplo:
*
* https://seusite.vercel.app/?ref=cliente123
*
*/


const urlParams =
    new URLSearchParams(
        window.location.search
    );


const referencia =
    urlParams.get("ref") || null;



/*
===========================================================
STATUS
===========================================================
*/


function mostrarStatus(
    mensagem,
    tipo = ""
) {

    status.textContent =
        mensagem;

    status.className =
        tipo;

}



/*
===========================================================
ENVIO PARA SUPABASE
===========================================================
*/


async function salvarLocalizacao(
    latitude,
    longitude,
    accuracy
) {


    const dados = {

        referencia:
            referencia,

        latitude:
            latitude,

        longitude:
            longitude,

        precisao_metros:
            typeof accuracy === "number"
                ? accuracy
                : null,

        user_agent:
            navigator.userAgent,

        /*
         * O IP NÃO é obtido pelo navegador.
         *
         * Portanto, nesta versão de arquivo único
         * o IP não será preenchido automaticamente.
         */

        ip_address:
            null,

        capturado_em:
            new Date().toISOString()

    };


    const resposta =
        await fetch(

            `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`,

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`,

                    "Prefer":
                        "return=minimal"

                },

                body:
                    JSON.stringify(
                        dados
                    )

            }

        );


    if (!resposta.ok) {

        const erro =
            await resposta.text();

        console.error(
            "Erro Supabase:",
            erro
        );

        throw new Error(
            "Erro ao salvar localização."
        );

    }


    return true;

}



/*
===========================================================
SOLICITAR LOCALIZAÇÃO
===========================================================
*/


function solicitarLocalizacao() {


    /*
     * Verifica suporte do navegador.
     */

    if (
        !navigator.geolocation
    ) {

        mostrarStatus(
            "Seu navegador não permite acesso à localização.",
            "error"
        );

        return;

    }


    /*
     * Desabilita enquanto processa.
     */

    locationButton.disabled =
        true;


    mostrarStatus(
        "Solicitando sua localização..."
    );



    /*
     * IMPORTANTE:
     *
     * getCurrentPosition()
     * só é chamado depois do clique.
     */

    navigator.geolocation.getCurrentPosition(


        /*
        ===================================================
        SUCESSO
        ===================================================
        */

        async function(position) {


            const latitude =
                position.coords.latitude;


            const longitude =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;



            mostrarStatus(
                "Localização autorizada. Processando..."
            );



            try {


                await salvarLocalizacao(

                    latitude,

                    longitude,

                    accuracy

                );


                mostrarStatus(

                    "Localização registrada com sucesso.",

                    "success"

                );


            } catch (erro) {


                console.error(
                    erro
                );


                mostrarStatus(

                    "Não foi possível registrar a localização. Tente novamente.",

                    "error"

                );


                locationButton.disabled =
                    false;

            }

        },


        /*
        ===================================================
        ERRO
        ===================================================
        */

        function(error) {


            locationButton.disabled =
                false;



            switch (
                error.code
            ) {


                case
                    error.PERMISSION_DENIED:


                    mostrarStatus(

                        "A localização é necessária. Permita o acesso à localização e tente novamente.",

                        "error"

                    );

                    break;



                case
                    error.POSITION_UNAVAILABLE:


                    mostrarStatus(

                        "Não foi possível obter sua localização. Verifique o GPS ou a conexão e tente novamente.",

                        "error"

                    );

                    break;



                case
                    error.TIMEOUT:


                    mostrarStatus(

                        "A localização demorou muito para responder. Tente novamente.",

                        "error"

                    );

                    break;



                default:


                    mostrarStatus(

                        "Não foi possível obter sua localização. Tente novamente.",

                        "error"

                    );

            }

        },


        /*
        ===================================================
        CONFIGURAÇÕES
        ===================================================
        */

        {

            enableHighAccuracy:
                true,

            timeout:
                30000,

            maximumAge:
                0

        }

    );

}



/*
===========================================================
EVENTO DO BOTÃO
===========================================================
*
* A solicitação de localização NÃO acontece
* automaticamente.
*
* Ela somente acontece quando o visitante
* clica no botão.
*/


locationButton.addEventListener(

    "click",

    solicitarLocalizacao

);


</script>


</body>
