<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><section class="card"><h1>Criar minha conta</h1><p class="muted">Cadastre seus dados para acessar sua própria área.</p><form id="f"><div class="field"><label>Nome completo</label><input id="nome" required></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="senha" type="password" minlength="6" required></div><div class="field"><label>Confirmar senha</label><input id="conf" type="password" minlength="6" required></div><div class="field"><label>Referência</label><input id="ref"></div><button class="btn">Criar minha conta</button></form><div id="msg"></div><p><a href="/login">Já tenho uma conta</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/lib/supabase.js"></script><script>f.onsubmit=async e=>{e.preventDefault();if(senha.value!==conf.value){msg.className="msg error";msg.textContent="As senhas não coincidem.";return}const r=await sb.auth.signUp({email:email.value.trim(),password:senha.value});if(r.error){msg.className="msg error";msg.textContent=r.error.message;return}const p=await sb.from("perfis").insert({user_id:r.data.user.id,nome:nome.value.trim(),referencia:ref.value.trim()||null});if(p.error){msg.className="msg error";msg.textContent=p.error.message;return}msg.className="msg success";msg.textContent="Cadastro concluído. Verifique seu e-mail se necessário.";setTimeout(()=>location.href="/login",1000)}</script></body></html>
