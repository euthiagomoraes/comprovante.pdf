<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu painel</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><div class="top"><div><h1>Meu painel</h1><div id="hello" class="muted"></div></div><button class="btn secondary" id="sair">Sair</button></div><section class="card"><h2>Meus dados</h2><div id="dados">Carregando…</div></section><section class="card"><h2>Meu link de localização</h2><div id="link"></div><div class="actions"><button class="btn" id="copiar">Copiar link</button><button class="btn secondary" id="editar">Editar</button></div><div id="editbox" class="hidden"><div class="field"><label>Nome personalizado</label><input id="slug"></div><button class="btn" id="salvar">Salvar</button></div></section><section class="card"><h2>Última localização</h2><div id="ultima" class="muted">Carregando…</div></section><section class="card"><h2>Histórico</h2><div id="hist" class="muted">Carregando…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/lib/supabase.js"></script><script src="/lib/auth.js"></script><script>let user,linkAtual;const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const map=(a,b)=>"https://www.google.com/maps?q="+a+","+b;async function init(){user=await requireUser();if(!user)return;const p=await sb.from("perfis").select("*").eq("user_id",user.id).single();if(p.error)return dados.innerHTML='<div class="msg error">'+esc(p.error.message)+'</div>';hello.textContent="Olá, "+p.data.nome;dados.innerHTML='<div class="row"><b>Nome</b><span>'+esc(p.data.nome)+'</span></div><div class="row"><b>E-mail</b><span>'+esc(user.email)+'</span></div><div class="row"><b>Referência</b><span>'+esc(p.data.referencia||"—")+'</span></div>';let l=await sb.from("links_compartilhados").select("*").eq("user_id",user.id).eq("ativo",true).maybeSingle();if(!l.data){const token=crypto.randomUUID().replaceAll("-","");const s=(p.data.nome||"meu-link").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,35)||"meu-link";l=await sb.from("links_compartilhados").insert({user_id:user.id,token,slug:s}).select().single()}linkAtual=l.data;render();load()}function render(){const u=location.origin+"/localizacao?ref="+encodeURIComponent(linkAtual.slug);link.innerHTML='<div class="linkbox">'+esc(u)+'</div>';slug.value=linkAtual.slug}async function load(){const r=await sb.from("localizacoes").select("*").eq("user_id",user.id).order("capturado_em",{ascending:false}).limit(50);if(r.error){ultima.textContent=r.error.message;return}if(!r.data.length){ultima.textContent="Nenhuma localização recebida ainda.";hist.textContent="Nenhum registro.";return}const x=r.data[0];ultima.innerHTML='<b>'+esc(x.endereco_formatado||"Localização recebida")+'</b><br>'+new Date(x.capturado_em).toLocaleString("pt-BR")+'<br><a target="_blank" rel="noopener" href="'+map(x.latitude,x.longitude)+'">Abrir no Google Maps</a>';hist.innerHTML=r.data.map(x=>'<div class="row"><span>'+new Date(x.capturado_em).toLocaleString("pt-BR")+'<br>'+esc(x.endereco_formatado||"Coordenadas")+'</span><a target="_blank" rel="noopener" href="'+map(x.latitude,x.longitude)+'">Mapa</a></div>').join("")}editar.onclick=()=>editbox.classList.toggle("hidden");salvar.onclick=async()=>{const s=slug.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,50);const r=await sb.from("links_compartilhados").update({slug:s}).eq("id",linkAtual.id).select().single();if(r.error)return alert(r.error.message);linkAtual=r.data;render();editbox.classList.add("hidden")};copiar.onclick=()=>navigator.clipboard.writeText(location.origin+"/localizacao?ref="+encodeURIComponent(linkAtual.slug));sair.onclick=signOut;init()</script></body></html>
