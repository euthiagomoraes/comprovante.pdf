<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><div class="top"><div><h1>Administração</h1><div class="muted">Usuários cadastrados</div></div><button class="btn secondary" id="sair">Sair</button></div><section class="card"><input id="busca" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px" placeholder="Pesquisar"><div id="lista">Carregando…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/lib/supabase.js"></script><script src="/lib/auth.js"></script><script>let rows=[];const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));async function init(){const u=await requireUser();if(!u)return;const p=await sb.from("perfis").select("role").eq("user_id",u.id).single();if(p.data?.role!=="admin"){location.href="/painel";return}const r=await sb.from("admin_resumo").select("*").order("criado_em",{ascending:false});if(r.error){lista.innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';return}rows=r.data||[];render()}function render(){const q=busca.value.toLowerCase();const a=rows.filter(x=>[x.nome,x.email,x.referencia].some(v=>String(v||"").toLowerCase().includes(q)));lista.innerHTML=a.map(x=>'<div class="row"><div><b>'+esc(x.nome)+'</b><br>'+esc(x.email||"")+'<br>'+esc(x.referencia||"")+'</div><div>'+Number(x.total_localizacoes||0)+' localização(ões)</div></div>').join("")||"Nenhum usuário encontrado."}busca.oninput=render;sair.onclick=signOut;init()</script></body></html>
