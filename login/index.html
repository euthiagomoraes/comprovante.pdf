<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><section class="card"><h1>Entrar</h1><form id="f"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="senha" type="password" required></div><button class="btn">Entrar</button></form><div id="msg"></div><p><a href="/cadastro">Criar minha conta</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/lib/supabase.js"></script><script>f.onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:senha.value});if(r.error){msg.className="msg error";msg.textContent=r.error.message;return}const p=await sb.from("perfis").select("role").eq("user_id",r.data.user.id).single();location.href=p.data?.role==="admin"?"/adm":"/painel"}</script></body></html>
